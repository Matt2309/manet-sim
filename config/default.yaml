# Configurazione di default per il simulatore MANET-sim.
# Blocco 1 (mobilità): nessun valore numerico è cablato nel codice Python,
# tutte le costanti del modello stanno qui.

simulation:
  dt: 0.1                  # passo di simulazione in secondi
  duration: null           # secondi; null = usa l'intera traccia GPX
  seed: 42                 # seme RNG, per riproducibilità

track:
  gpx_file: "../data/gpx/Corsa_serale.gpx"  # relativo a questo file di configurazione
  assumed_sample_rate: 1.0    # Hz; il GPX non ha timestamp (vedi docstring di load_track)
  glitch_max_step: 8.0        # m; passi oltre questa soglia sono buchi di campionamento GPS
  start_offset: 20.0          # m; da dove parte il gruppo lungo il percorso (margine per l'OU a regime)
  speed_smoothing_window: 5.0 # s; finestra della media mobile sul profilo di velocità
  heading_smoothing: 6.0      # m; larghezza della media mobile della direzione del percorso lungo s (riferimento locale continuo nelle curve)
  end_margin: 20.0            # m; con duration=null, ci si ferma a length - end_margin
  plausible_speed_range: [1.5, 6.0]  # m/s; range atteso per la corsa, usato per validare
                                      # a runtime l'assunzione di campionamento uniforme

group:
  n_nodes: 5
  longitudinal_spread: 10.0   # m; estensione testa-coda del gruppo (statistica: spread_statistic)
  lateral_spread: 2.0         # m; larghezza della formazione (stessa statistica)
  correlation_time: 8.0       # s; costante di tempo longitudinale degli scostamenti (OU del 2° ordine a smorzamento critico)
  lateral_correlation_time: 2.5  # s; costante di tempo laterale: tornare sulla propria linea dopo una schivata è più rapido della deriva longitudinale
  spread_statistic: p95       # come interpretare *_spread: "mean" | "p95"
  min_node_gap: 1.2           # m; distanza di riferimento fra nodi: la repulsione cresce sotto di essa
  repulsion:                  # forza repulsiva fra i corridori, nel piano: A·(exp((g-d)/B) - exp((g-R)/B)) per d < R
    strength: 1.0             # m/s^2; A, accelerazione a distanza g (circa)
    scale: 0.3                # m; B, scala della crescita esponenziale
    action_distance: 2.4      # m; R, oltre questa distanza la forza è nulla
  warmup_taus: 3.0            # tempi di correlazione simulati e scartati prima di registrare (stato stazionario con la repulsione)
  margin_sigmas: 4.0          # start_offset/end_margin richiesti, in unità di sigma_long
  spread_margin_factor: 1.5   # longitudinal_spread deve superare (n_nodes-1)*min_node_gap*fattore
  max_relative_speed_p99: 1.0 # m/s; p99 della velocità relativa al baricentro (a passo dt) sotto cui il moto è realistico
  max_relative_speed: 2.0     # m/s; massimo della velocità relativa al baricentro (a passo dt)
  calibration:                 # calibrazione numerica di sigma sull'uscita (con la repulsione)
    groups: 100               # gruppi indipendenti simulati
    duration: 300.0           # s registrati per gruppo
    seed: 0
    max_iterations: 30
    tolerance: 0.001          # convergenza relativa sulla statistica osservata

separation:
  enabled: false
  node_id: 4               # quale nodo si separa
  start_time: 300.0        # s; istante di inizio della separazione
  target_speed: 1.8        # m/s; velocità a cui il nodo rallenta
  ramp_duration: 5.0        # s; tempo per passare dalla velocità di gruppo a target_speed

# Blocco 2 (canale): RSSI di ogni coppia ordinata di nodi.
channel:
  frequency: 2.437e+9         # Hz, canale Wi-Fi 6
  tx_power: 10.0              # dBm; ridotta da 17 per evitare la saturazione (esp_wifi_set_max_tx_power)
  antenna_gain_tx: 0.0        # dBi
  antenna_gain_rx: 0.0        # dBi

  path_loss:
    exponent: 3.0             # n; 3 all'aperto, 4 al chiuso
    reference_distance: 1.0   # m; d0: sotto questa distanza l'attenuazione resta quella a d0

  shadowing:
    enabled: true
    mode: field               # "field" (mappa condivisa) | "independent" (per link)
    sigma: 4.0                # dB; deviazione standard sui link lunghi (field) o su tutti (independent)
    correlation_distance: 7.0 # m; delta, distanza di correlazione
    grid_resolution: 1.0      # m; passo della griglia della mappa
    field_margin: 50.0        # m; margine attorno all'area percorsa
    fft_padding: 70.0         # m; padding della FFT (>= 10 delta: la correlazione residua fra i bordi opposti è e^-10)
    integration_step: 0.5     # m; passo di campionamento lungo il segmento del link
    long_link_factor: 50.0    # i link più lunghi di questo multiplo di delta usano il passo grande
    long_link_step_factor: 0.5 # passo di integrazione dei link lunghi, in unità di delta
    chunk_points: 4000000     # punti di integrazione per blocco (solo memoria, non cambia il risultato)

  body:
    own:
      enabled: true
      mount_side: right       # scheda sulla spalla destra -> il torso blocca verso sinistra
      max_loss: 12.0          # dB, quando l'altro nodo è esattamente dal lato del torso
      lobe_exponent: 3.0      # forma del lobo: più alto = lobo più stretto
    others:
      enabled: true
      loss: 8.0               # dB per ogni corridore che sta in mezzo al link
      radius: 0.2             # m; il corridore è un cilindro verticale di questo raggio
      transition_width: 0.05  # m; larghezza della transizione graduale al bordo del cilindro
      max_total_loss: 12.0    # dB; tetto alla somma delle perdite di più corridori (il 2° e 3° corpo bloccano meno del 1°: il segnale gira attorno)

  fading:
    enabled: true
    rician_k_db: 6.0          # fattore K di Rice in dB

  device_offset:
    enabled: true
    sigma: 1.5                # dB; scarto fisso per scheda, separato per trasmissione e ricezione

  measurement:
    saturation_dbm: -30.0     # dBm; valore da verificare sulle schede
    quantization_step: 1.0    # dB; l'ESP32 restituisce un intero in dBm

  obstacles:
    enabled: false            # edifici da OpenStreetMap: Blocco 2b, per ora contributo nullo

# Blocco 3 (pacchetti): beacon ESP-NOW e ricezione.
packets:
  beacon_period: 0.5          # s; intervallo fra due beacon dello stesso nodo (2 Hz, come il firmware)
  jitter: 0.05                # s; ritardo casuale uniforme in [-jitter, +jitter] su ogni intervallo
  reception:
    model: curve              # "curve" (probabilità graduale) | "threshold" (soglia netta, per confronto)
    sensitivity_dbm: -98.4    # dBm; ESP32-S3 Series Datasheet, tab. 6-4, 802.11b 1 Mbit/s, valore tipico
    sensitivity_success: 0.92 # probabilità di ricezione alla sensibilità (definizione 802.11b: 8% di pacchetti persi)
    transition_width: 2.0     # dB; da 10% a 90% di ricezione. Valore iniziale, da misurare con le Heltec
    background_loss: 0.02     # probabilità di perdita indipendente dal segnale (interferenze Wi-Fi)
    # Blocco 6 (D2): perdite di fondo a raffiche. "independent" riproduce esattamente il Blocco 3.
    background_model: independent   # "independent" | "bursty"
    bursty:                        # Gilbert-Elliott a due stati (buono / disturbato), catena di Markov sulla griglia dt
      mean_loss: 0.02            # frazione di tempo in cui il ricevitore è disturbato
      mean_burst: 1.0            # s, durata media di una raffica
      loss_bad: 1.0              # perdita nello stato disturbato
      burst_scope: receiver      # "receiver" | "link"

# Blocco 4: Kalman per link, tabella dei vicini, fusione, allarmi, metriche.
kalman:
  measurement_noise: auto        # dB²; "auto" = varianza del fading (Blocco 2) + 1/12 di quantizzazione
  sigma_a: 0.25                  # dB/s²; quanto in fretta può cambiare la pendenza (Blocco 6: 0.25; il Blocco 4 usava 0.5)
  sigma_a_sweep: [0.25, 0.5, 1.0, 2.0]
  initial_slope_std: 3.0         # dB/s; incertezza iniziale sulla pendenza
  reinit_gap: 10.0               # s; dopo un silenzio più lungo il filtro riparte da zero
  # Blocco 5 (D): robustezza ai salti da corpo. I default riproducono il Blocco 4.
  robust: none                   # "none" | "inflate" | "nis_gate"
  r_inflation: 1.0               # "inflate": R moltiplicato per questo fattore
  r_inflation_sweep: [2.0, 4.0]
  nis_gate: 9.0                  # "nis_gate": oltre questa NIS l'aggiornamento usa R·NIS/nis_gate (9 = 3 sigma su chi quadro a 1 gdl)
neighbour_table:                 # 5 byte per vicino: id, RSSI, pendenza, dev. std, età
  rssi_step: 1.0                 # dB (int8)
  slope_step: 0.1                # dB/s (int8)
  std_step: 0.1                  # dB (uint8)
  age_step: 0.1                  # s (uint8, satura)
fusion:
  max_age: 2.0                   # s; le voci più vecchie sono escluse
  max_age_own: true              # vale anche per la stima propria del link i→m (false = resta sempre, con varianza crescente)
  # Blocco 5 (A): regola di fusione sull'indice di segnale (più alto = più vicino).
  rule: weighted_mean            # "weighted_mean" | "median" | "max"; Blocco 6: verdetto = media (results/block6/verdict.yaml)
  rule_sweep: [weighted_mean, median, max]
detector:
  mode: level                    # "level" | "slope" | "both" (Blocco 6: level; il Blocco 4 usava both)
  scope: fused                   # "fused" | "pairwise"
  level_threshold: -75.0         # dBm; soglia CONGELATA sulla taratura per il rilevatore finale (results/block6/frozen_thresholds.yaml); circa 30 m con la sola distanza
  slope_threshold: -0.5          # dB/s; soglia in "slope", conferma in "both"
  min_duration: 1.0              # s; durata minima della condizione per accendere il pre-allarme
  lost_silence: 10.0             # s; allarme "nodo perso"
  release_time: 30.0             # s di ricezione buona per spegnere un allarme (Blocco 6: adottato dal Blocco 5; era 5.0)
  lost_rule: any                 # Blocco 6 (D4): "any" | "not_deaf" (l'osservatore che non sente nessuno non dà il "perso")
  release_reception: 0.8         # frazione minima di beacon ricevuti in quella finestra
  release_level_margin: 3.0      # dB oltre la soglia per considerare rientrato il livello
  release_slope_margin: 0.5      # dB/s, idem per la pendenza
  min_observers: 1               # osservatori in allarme necessari per l'allarme di sistema
  warmup: 10.0                   # s iniziali esclusi
  # Blocco 5 (B): livello relativo = calo rispetto alla linea di base.
  reference: absolute            # "absolute" | "relative"
  baseline_window: 30.0          # s; la base è la mediana dei campioni accettati in questa finestra
  baseline_min_samples: 20       # campioni accettati minimi in finestra (10 s a 2 Hz); sotto, la base resta ferma
  freeze_drop: 6.0               # dB sotto la base: un campione più basso non è accettato (la base si congela)
  drop_threshold: 20.0           # dB; soglia del calo fuso (valore di default)
  min_observers_sweep: [1, 2]
  release_time_sweep: [5.0, 15.0, 30.0, 60.0]   # Blocco 5 (C)
metrics:
  scenarios: [none, slowdown, stop]
  n_runs: 50                     # corse per scenario
  stop_speed: 0.0                # m/s; scenario "si ferma"
  separation_start_range: [300.0, 2400.0]   # s; almeno 10 minuti dopo il distacco prima della fine
  success_window: 30.0           # s; solo informativo: colonna "entro 30 s" (il criterio di successo è success_distance)
  success_distance: 30.0         # m; rilevato in tempo se l'allarme di sistema si accende prima che la distanza minima dal gruppo superi questo valore
  max_alarm_time_fraction: 0.01  # un punto dello sweep è ammissibile solo se nelle corse none la frazione di tempo in allarme è <= questo valore
  confidence_level: 0.95         # livello degli intervalli di Wilson (P_d) e di Poisson (falsi allarmi per ora)
  target_false_alarms_per_hour: 1.0
  level_threshold_sweep: [-95.0, -60.0, 2.5]   # inizio, fine, passo (dBm)
  slope_threshold_sweep: [-4.0, -0.25, 0.25]   # inizio, fine, passo (dB/s)
  drop_threshold_sweep: [6.0, 40.0, 1.0]       # Blocco 5: inizio, fine, passo (dB)
  nis_histogram: [0.0, 12.0, 0.1]              # inizio, fine, passo dell'istogramma della NIS (solo grafico)
  reference_runs:                # corse da seguire nei grafici e nei resoconti: scenario -> indici
    stop: [26, 30]

# Blocco 5: esperimento di rifinitura. Il punto di lavoro "base" e le regole di scelta.
refinement:
  base: {sigma_a: 0.25, mode: level, scope: fused, variant: both}   # punto di lavoro del Blocco 4
  min_net_gain_runs: 3           # corse guadagnate - perse (slowdown + stop) per battere un'alternativa; meno = rumore
  repass_distance: 30.0          # m; ritorno sotto questa distanza dopo il rilevamento = ripassaggio
  shadowing_modes: [field, independent]
  nis_quantile: 0.99             # percentile della NIS riportato nel gruppo
  time_budget_minutes: 45        # stima oltre la quale l'esperimento si ferma e chiede (con 8 processi)
  drop_histogram: [-10.0, 60.0, 1.0]   # inizio, fine, passo (dB) dell'istogramma del calo fuso (diagnostica)
  time_estimate: {factor: 1.6, extra_minutes: 3.5}   # stima del tempo totale del Blocco 5: fase A-D * factor + extra (min, con 8 processi)

# Blocco 6: numeri finali e sensibilità.
final:
  n_runs: 100                    # corse di verifica per scenario
  sensitivity_runs: 50           # prime corse di verifica usate nella sensibilità
  seed_keys: {runs: 8, separation: 9, bursts: 10, bootstrap: 11}   # bootstrap: generatore dei ricampionamenti
  configs: [media, migliore, coppia]
  config_defs:                   # sostituzioni di config (chiavi puntate) per ciascuna configurazione
    media: {detector.scope: fused, fusion.rule: weighted_mean}
    migliore: {detector.scope: fused, fusion.rule: max}
    coppia: {detector.scope: pairwise, fusion.rule: weighted_mean}
  common:                        # fissate esplicitamente: il Blocco 6 non dipende dai default
    kalman.sigma_a: 0.25
    kalman.robust: none
    detector.mode: level
    detector.reference: absolute
    detector.release_time: 30.0
    detector.min_observers: 1
    detector.lost_rule: any
    packets.reception.background_model: independent
  min_net_gain: 3                # corse nette per adottare "migliore"
  bootstrap_samples: 2000
  time_budget_minutes: 60        # stima oltre la quale l'esperimento si ferma e chiede (con 8 processi)
  burst_long: 10.0               # s; una raffica più lunga di questo valore fa scattare il "perso" (= detector.lost_silence)
  sensitivity_points:
    sens_96:     {packets.reception.sensitivity_dbm: -96.0}
    bursty_2_1:  {packets.reception.background_model: bursty, packets.reception.bursty.mean_loss: 0.02, packets.reception.bursty.mean_burst: 1.0}
    bursty_2_3:  {packets.reception.background_model: bursty, packets.reception.bursty.mean_loss: 0.02, packets.reception.bursty.mean_burst: 3.0}
    bursty_5_3:  {packets.reception.background_model: bursty, packets.reception.bursty.mean_loss: 0.05, packets.reception.bursty.mean_burst: 3.0}
    pessimista:  {packets.reception.sensitivity_dbm: -96.0, packets.reception.background_model: bursty, packets.reception.bursty.mean_loss: 0.05, packets.reception.bursty.mean_burst: 3.0}
  not_deaf_points: [base, bursty_2_1, bursty_2_3, bursty_5_3, pessimista]   # punti in cui si prova anche lost_rule: not_deaf

# Blocco 7: routing verso il capogruppo. Non cambia i Blocchi 1-6.
routing:
  scenario_overrides:            # solo per l'esperimento del Blocco 7
    group.n_nodes: 10
    group.longitudinal_spread: 35.0
    group.lateral_spread: 5.0    # 2 m non è raggiungibile con 10 nodi: sigma_lat va a ~0 e la larghezza p95 (4,4 m) viene dalla sola repulsione
    track.start_offset: 35.0     # >= margin_sigmas * sigma_long (31,7 m)
    track.end_margin: 35.0
  channel_profile: heltec_run    # nominal | heltec_run; heltec_run è l'unico punto di lavoro in tesi, nominal resta come confronto
  channel_profiles:              # sostituzioni di canale (solo Blocco 7), applicate dopo scenario_overrides
    nominal: {}
    heltec_run:                  # livelli misurati nella corsa con le Heltec del 13 ottobre
      channel.tx_power: -17.0    # dBm EQUIVALENTI (EIRP con perdite di antenna, montaggio e corpi), non impostabili sull'ESP32. Tarato con scripts/calibrate_heltec_power.py: mediana RSSI nel gruppo da 5 = -78,0 dBm
      packets.reception.sensitivity_dbm: -96.0
      routing.candidate_threshold: -88.0   # 8 dB sopra la sensibilità, come -90 su -98,4
  n_runs: 50
  seed_keys: {runs: 12, separation: 13, leader: 14, unicast: 15, sos: 16}
  strategies: [direct, best_rssi, dqrem, dqrem_no_slope]
  neighbour_max_age: 2.0         # s
  candidate_threshold: -90.0     # dBm
  max_hops: 8
  ttb_cap: 60.0                  # s
  ahp_matrix: [[1, 1, 3, 5, 5], [1, 1, 3, 5, 5], [0.3333, 0.3333, 1, 2, 2],
               [0.2, 0.2, 0.5, 1, 1], [0.2, 0.2, 0.5, 1, 1]]
  ahp_random_index: {3: 0.58, 4: 0.90, 5: 1.12}   # indice casuale di Saaty per n criteri
  reception_window: 10.0         # s, finestra di C4 (frazione di beacon ricevuti)
  entropy_window: 60.0           # s
  entropy_min_samples: 20
  alpha: 0.5                     # peso AHP contro entropia
  record_period: 1.0             # s
  max_records: 10
  max_packet_bytes: 250          # ESP-NOW v1; sweep informativo con 1470 (v2)
  packet_bytes_sweep: [1470]
  packet_header_bytes: 4
  max_wait: 1.0                  # s
  max_retries: 3
  buffer_records: 600
  degraded_period: 5.0           # s, 0,2 Hz a buffer pieno
  sos_window: 120.0              # s
  fresh_age: 5.0                 # s
  oracle_distance: 30.0          # m, allarme oracolo: distanza del separato dal gruppo
  warmup: 10.0                   # s iniziali esclusi dalle metriche
  end_margin: 60.0               # s finali: i record creati dopo non entrano nella consegna
  view_age_thresholds: [5.0, 10.0]   # s
  distance_bins: [0.0, 10.0, 20.0, 30.0, 50.0, 1.0e+9]   # m, consegna per distanza dal capogruppo
  airtime: {preamble_us: 192.0, us_per_byte: 8.0, ack_bytes: 14}   # 802.11b 1 Mbit/s
  min_break_reduction: 0.2       # DQREM "ripaga" se riduce le rotture di almeno questa frazione rispetto a best_rssi
  time_budget_minutes: 60        # stima oltre la quale l'esperimento si ferma e chiede (con 8 processi)
  reference_run: {scenario: stop, index: 0}   # corsa di cui si salva la traccia per route_example.png

# Configurazione del Blocco 4 (sostituzioni ai default del Blocco 6): serve agli script dei Blocchi 4-5 e ai test.
history:
  block4:
    kalman.sigma_a: 0.5
    detector.mode: both
    detector.release_time: 5.0
    detector.lost_rule: any
    fusion.rule: weighted_mean
    kalman.robust: none
    packets.reception.background_model: independent
